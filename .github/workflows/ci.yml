name: CI

# Fast tier (section 9/13's "Fast CI"): runs on every PR and every push to
# main. No service containers, no repository secrets required at all --
# the entire backend suite mocks repository/DB calls (verified directly:
# all 417 tests pass even pointed at a deliberately unreachable
# DATABASE_URL/REDIS_URL), so Settings only needs syntactically valid
# placeholder values to construct, never real connectivity.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push/PR update cancels whatever this workflow was already running
# for the same PR/branch -- no point finishing a check against code that's
# already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder-only values -- never real secrets, and deliberately not
  # sourced from GitHub Actions `secrets` at all for this fast tier (see
  # docs/operations/ci.md for the full test/staging/production secret-tier
  # separation this repo follows).
  DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5999/ci_placeholder_unreachable
  REDIS_URL: redis://127.0.0.1:5999/0
  JWT_SECRET_KEY: ci-only-placeholder-jwt-secret-not-a-real-secret
  OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
  CONNECTOR_SECRET_MASTER_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddee
  ENVIRONMENT: test

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    # Added Batch 4.5 after a real (session-local, never-committed -- see
    # docs/operations/security-incidents.md) credential exposure incident.
    # Scans full git history, not just the diff -- a leaked credential is a
    # leaked credential the moment it's committed, regardless of which PR
    # first introduces it. `--redact` means a real match's own report never
    # contains the secret value itself, only its rule/file/line -- satisfying
    # "the scanner itself must not print discovered secrets."
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan repository + full history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v

  backend:
    name: Backend tests + import-linter + deterministic evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.19"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --extra dev

      - name: Backend tests
        run: >
          uv run pytest tests/ -q
          --deselect tests/ingestion_retrieval/test_connectors.py::test_one_connector

      - name: Import-linter (module boundary contracts)
        run: uv run lint-imports

      # Deterministic (Mode 1) evaluation -- retrieval/grounding/answer/
      # investigation regression detection against the fixture corpus in
      # app/evaluation/fixtures/. Belongs in THIS fast tier, not in
      # e2e-and-eval.yml alongside `eval_confidence.py`, precisely because
      # it needs none of what that tier needs: no live database, no
      # OPENAI_API_KEY, no service containers, no secrets. The job-level
      # placeholder env vars at the top of this workflow are the only
      # configuration it sees, and it never opens a connection with them.
      #
      # Added as a step in this existing job rather than a separate job so
      # it reuses the `uv sync` above (a separate job would re-download and
      # rebuild the entire dependency tree to run a ~10-second check).
      #
      # Exit code semantics matter here and are NOT "fail if any case
      # failed": the fixture suite deliberately ships 10 negative controls
      # that are *supposed* to fail, proving the evaluator detects real
      # defects. The script exits non-zero only on a genuine regression --
      # an expected-pass case failing, a negative control passing (i.e. it
      # stopped detecting anything), or a control failing at the wrong
      # pipeline stage. See scripts/run_evaluation.py's own docstring.
      - name: Deterministic AI evaluation (regression gate)
        run: >
          uv run python scripts/run_evaluation.py
          --report-path run_evaluation_report.json

      # Uploaded unconditionally (`if: always()`), unlike the E2E workflow's
      # failure-only Playwright artifact: this report is the run's only
      # record of the actual retrieval/grounding/calibration *numbers*, which
      # are worth having from a green build too -- comparing a passing run's
      # metrics against an earlier passing run's is how a slow quality drift
      # (still-passing, but Recall@5 sliding down) gets noticed at all. The
      # report contains only fixture-corpus content and computed metrics --
      # no credentials, no customer data, nothing from any real database.
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-evaluation-report
          path: run_evaluation_report.json
          retention-days: 30
          if-no-files-found: warn

  frontend:
    name: Frontend type-check, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # VITE_API_BASE_URL is compiled into the bundle -- a placeholder is
        # fine for a build-succeeds check; the real deployment build supplies
        # the actual API origin (see frontend/Dockerfile).
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
