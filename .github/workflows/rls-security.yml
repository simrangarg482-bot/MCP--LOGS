name: RLS Security Gate

# A dedicated, mandatory tenant-isolation security gate -- independent of
# `ci.yml`'s fast/mocked tier (which cannot validate real Postgres RLS at
# all: every DB call there is mocked) and independent of
# `e2e-and-eval.yml`'s OpenAI-dependent tiers (which are gated
# `if: secrets.OPENAI_API_KEY != ''` and SKIP, not fail, when that secret is
# unset -- meaning tenant-isolation coverage must never live only there, or
# a missing OpenAI key would make the whole repository's RLS story
# unverified while every check still shows green).
#
# This workflow needs no external AI API, no embeddings, no LangGraph, and
# no production credentials -- only a disposable, CI-local Postgres +
# pgvector, real Alembic migrations, and the real `ekip_app` runtime role
# (EKIP_TENANT_ISOLATION_SECURITY_REVIEW.md recommendation #2). It runs on
# every PR and every push to main, the same triggers as `ci.yml`, and is
# meant to be added as a required status check in branch protection (see
# docs/operations/ci.md) -- this file cannot configure that itself; a repo
# admin must do it once in GitHub's own settings.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: rls-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-security-gate:
    name: RLS Security Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ekip
          POSTGRES_PASSWORD: ekip_ci_only
          POSTGRES_DB: ekip_rls_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ekip -d ekip_rls_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # RUNTIME connection -- the one and only thing this job's actual
      # security check (scripts/verify_rls_isolation.py) uses. This is the
      # ekip_app role (NOSUPERUSER/NOBYPASSRLS, provisioned by migration
      # b8f3d6a1c4e7), never this disposable Postgres's own superuser.
      DATABASE_URL: postgresql+asyncpg://ekip_app:ci-only-placeholder-ekip-app-password-not-a-real-secret@127.0.0.1:5432/ekip_rls_ci?sslmode=disable
      # ADMIN connection, used ONLY by the "Run migrations" step below (see
      # app/database/migrations/base.py's migration_database_url setting).
      # ekip_app is deliberately never granted CREATE ROLE/ALTER TABLE/
      # GRANT, so alembic cannot run as DATABASE_URL above.
      MIGRATION_DATABASE_URL: postgresql+asyncpg://ekip:ekip_ci_only@127.0.0.1:5432/ekip_rls_ci?sslmode=disable
      # Read by migration b8f3d6a1c4e7 when `alembic upgrade head` runs
      # against MIGRATION_DATABASE_URL above -- must match the password
      # embedded in DATABASE_URL above.
      EKIP_APP_ROLE_PASSWORD: ci-only-placeholder-ekip-app-password-not-a-real-secret
      # This tier needs no LLM calls at all -- REDIS_URL/JWT_SECRET_KEY/
      # OPENAI_API_KEY/CONNECTOR_SECRET_MASTER_KEY only need to be
      # syntactically valid for Settings to construct (the same reasoning
      # ci.yml's fast tier documents for its own placeholders), and
      # OPENAI_API_KEY here is a hardcoded placeholder, deliberately NOT
      # sourced from `secrets.OPENAI_API_KEY` -- this job must run
      # identically whether or not that secret is configured anywhere in
      # the repository.
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-only-placeholder-jwt-secret-not-a-real-secret
      OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
      CONNECTOR_SECRET_MASTER_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddee
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.19"
      - run: uv python install 3.13
      - run: uv sync --frozen --extra dev

      - name: Run migrations (admin/migration role)
        run: uv run alembic upgrade head

      - name: RLS tenant-isolation security check (ekip_app runtime role)
        # scripts/verify_rls_isolation.py exits non-zero and prints exactly
        # which named security check failed (role identity, BYPASSRLS,
        # superuser, required grants, RLS enabled+forced on every
        # policy-bearing table, same-tenant reads, and -- the core proof --
        # cross-tenant reads via a query with NO organization_id filter at
        # all) -- see that script's own docstring for the full contract.
        run: uv run python scripts/verify_rls_isolation.py

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### RLS Security Gate: PASS :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            echo "Real Postgres + pgvector, real migrations, ekip_app runtime role, cross-tenant isolation verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### RLS Security Gate: FAIL :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "See the \"RLS tenant-isolation security check\" step's log above for exactly which check failed." >> "$GITHUB_STEP_SUMMARY"
          fi
