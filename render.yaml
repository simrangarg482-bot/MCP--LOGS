# Render Blueprint (https://render.com/docs/blueprint-spec) -- runs only the
# two arq background workers. The backend API itself runs on Cloudflare
# Containers instead (see cloudflare/backend/ and
# docs/operations/deployment-cloudflare.md) -- Cloudflare Containers has no
# standalone/non-HTTP process mode ("all Container requests are passed
# through a Worker", per Cloudflare's own docs), so it cannot host
# `app.ingestion.workers.main.WorkerSettings` or
# `app.agents.workers.main.WorkerSettings`, both of which just poll Redis
# forever and never serve HTTP. Render's native Python runtime (no Docker)
# runs them instead.
#
# Postgres (pgvector) and Redis are NOT defined here -- Render's own managed
# Postgres doesn't ship the pgvector extension, so this deployment uses an
# external Neon database (already this project's target per
# app/shared/config/settings.py's docstrings) and an external Redis (e.g.
# Upstash, TLS/`rediss://`) -- the same instance the Cloudflare-hosted
# backend connects to. Set DATABASE_URL/REDIS_URL to those in the
# ekip-shared env var group below (Render dashboard, not committed here).
#
# Deploy: connect this repo in the Render dashboard ("New +" -> "Blueprint"),
# it discovers this file automatically. Every `sync: false` var must be
# filled in by hand once, in the dashboard, before the first deploy succeeds.

envVarGroups:
  - name: ekip-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        sync: false # postgresql+asyncpg://<user>:<pass>@<neon-host>/<db>?ssl=require
      - key: REDIS_URL
        sync: false # rediss://default:<password>@<upstash-host>:<port>
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false # generate: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: KMS_PROVIDER
        value: local
      - key: CONNECTOR_SECRET_MASTER_KEY
        sync: false # generate: python -c "import secrets; print(secrets.token_hex(32))"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://ekip-frontend.pages.dev (unused by the workers themselves, kept here only because Settings() loads the whole env)

services:
  - type: worker
    name: ekip-ingestion-worker
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run arq app.ingestion.workers.main.WorkerSettings
    envVarGroups:
      - ekip-shared

  - type: worker
    name: ekip-agents-worker
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run arq app.agents.workers.main.WorkerSettings
    envVarGroups:
      - ekip-shared
